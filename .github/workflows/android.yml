name: Android CI - Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace --info

    - name: Check build outputs
      if: always()
      run: |
        echo "=== Checking for APK files ==="
        find app/build -type f -name "*.apk" 2>/dev/null || echo "No APK files found"
        echo "=== Build outputs directory ==="
        ls -laR app/build/outputs/ 2>/dev/null || echo "outputs directory not found"
        echo "=== Build directory exists? ==="
        ls -la app/build/ 2>/dev/null || echo "app/build/ directory not found"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ai-manager-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn
