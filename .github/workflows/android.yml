name: Android CI - Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Find Debug APK
      run: find . -name "*.apk" -path "*/debug/*" -type f

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: ai-manager-debug-apk
        path: '**/build/outputs/apk/debug/*.apk'

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Find Release APK
      run: find . -name "*.apk" -path "*/release/*" -type f

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: ai-manager-release-apk
        path: '**/build/outputs/apk/release/*.apk'
