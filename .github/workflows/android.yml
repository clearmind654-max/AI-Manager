name: Android CI - Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-configuration-cache

    - name: List APK outputs
      run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"

    - name: List build outputs
      run: ls -laR app/build/outputs/ 2>/dev/null || echo "No build outputs directory"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: ai-manager-debug-apk
        path: '**/*.apk'
        if-no-files-found: warn
