name: Android CI - Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify gradlew works
      run: ./gradlew --version

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Diagnose build outputs
      if: always()
      run: |
        echo "=== APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files"
        echo "=== Build intermediates ==="
        ls -la app/build/intermediates/ 2>/dev/null || echo "No intermediates directory"
        echo "=== Full app/build structure (top level) ==="
        ls -la app/build/ 2>/dev/null || echo "No app/build/ directory"
        echo "=== Check app/build.gradle.kts android block ==="
        grep -A 10 "android {" app/build.gradle.kts || echo "android block not found"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ai-manager-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn
